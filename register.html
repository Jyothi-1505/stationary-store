<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Create Account | Scholar Stationery</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- <link rel="stylesheet" href="assets/css/styles.css"> -->

    <link rel="stylesheet" href="assets/css/register.css" />
    <!-- <link rel="stylesheet" href="assets/css/login.css"> -->
  </head>

  <body>
    <main class="register-page">
      <div class="register-card">
        <div class="card-top">
          <div class="card-actions">
            <button
              class="circle-button"
              id="darkModeButton"
              aria-label="Dark Mode"
            >
              🌙
            </button>

            <button class="circle-button" id="rtlButton" aria-label="RTL">
              RTL
            </button>
          </div>

          <a href="index.html" class="brand" aria-label="Scholar Stationery Home">
                <span class="brand__logo">
                    <img src="https://www.svgrepo.com/show/492785/book-and-person-summer.svg"
                         alt="Scholar Stationery Logo">
                </span>
                <span class="brand__name">
                    Scholar<span>Stationery</span>
                </span>
            </a>

          <h2 class="register-title">Create Account</h2>

          <p class="register-description">
            Create your account to start shopping books, stationery and school
            essentials.
          </p>
        </div>

        <form class="register-form">
          <div class="form-field">
            <label for="fullName"> Full Name </label>

            <input
              type="text"
              id="fullName"
              placeholder="Enter your full name"
              required
            />
          </div>

          <div class="form-field">
            <label for="email"> Email Address </label>

            <input
              type="email"
              id="email"
              placeholder="Enter your email address"
              required
            />
          </div>

          <div class="form-field">
            <label for="password"> Password </label>

            <div class="password-wrapper">
              <input
                type="password"
                id="password"
                placeholder="Create a password"
                required
              />

              <button type="button" class="password-button">👁</button>
            </div>
          </div>
          <div class="form-field">
            <label for="confirmPassword"> Confirm Password </label>

            <div class="password-wrapper">
              <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm your password"
                required
              />

              <button type="button" class="password-button">👁</button>
            </div>
          </div>

          <div class="terms-wrapper">
            <label class="terms-checkbox">
              <input type="checkbox" id="terms" required />

              <span>
                I agree to the

                <a href="terms.html"> Terms & Conditions </a>

                and

                <a href="privacy-policy.html"> Privacy Policy </a>
              </span>
            </label>
          </div>

          <button type="submit" class="register-button">
            <span> Create Account </span>

            <svg
              class="button-arrow"
              xmlns="http://www.w3.org/2000/svg"
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <line x1="5" y1="12" x2="19" y2="12"></line>

              <polyline points="12 5 19 12 12 19"></polyline>
            </svg>
          </button>

          <div class="divider">
            <span> or sign up with </span>
          </div>

          <div class="social-login">
            <a href="#" class="social-button">
              <img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg">

              <span> Google </span>
            </a>

            <a href="#" class="social-button">
              <img src="https://upload.wikimedia.org/wikipedia/commons/4/44/Microsoft_logo.svg">

              <span> Microsoft </span>
            </a>

            <a href="#" class="social-button">
              <img src="https://cdn.simpleicons.org/apple" alt="Apple" />

              <span> Apple </span>
            </a>
          </div>

          <div class="signin-link">
            <p>
              Already have an account?

              <a href="login.html"> Sign In </a>
            </p>
          </div>
        </form>
      </div>
    </main>

    <script src="assets/js/register.js"></script>
  </body>
</html>
