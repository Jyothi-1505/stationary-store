<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Create Account | Scholar Stationery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/register.css">
</head>
<body>
<main class="register-page">
<div class="register-page-controls">
<button type="button" class="register-control-button" id="rtlButton" aria-label="Toggle RTL mode" title="RTL / LTR">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
<polyline points="17 1 21 5 17 9"></polyline>
<path d="M3 11V9a4 4 0 0 1 4-4h14"></path>
<polyline points="7 23 3 19 7 15"></polyline>
<path d="M21 13v2a4 4 0 0 1-4 4H3"></path>
</svg>
</button>
<button type="button" class="register-control-button" id="darkModeButton" aria-label="Toggle dark mode" title="Dark Mode">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
<path d="M21 12.79A9 9 0 1 1 11.21 3A7 7 0 0 0 21 12.79Z"></path>
</svg>
</button>
</div>
<div class="register-card">
<div class="card-top">
<a href="index.html" class="brand">
<div class="brand__logo">
<img src="https://d1csarkz8obe9u.cloudfront.net/posterpreviews/edu-smart-logos-design-template-23b6de7d02972a120e8ad62879fb66f4_screen.jpg?ts=1661512030" alt="EduMart Logo">
</div>
<div class="brand__text">
<h2>Edu<span>Mart</span></h2>
</div>
</a>
<h2 class="register-title">Create Account</h2>
</div>
<form class="register-form">
<div class="form-field">
<label for="fullName">Full Name</label>
<input type="text" id="fullName" placeholder="Enter your full name" required>
</div>
<div class="form-field">
<label for="email">Email Address</label>
<input type="email" id="email" placeholder="Enter your email address" required>
</div>
<div class="passwords">
<div class="form-field">
<label for="password">Password</label>
<div class="password-wrapper">
<input type="password" id="password" placeholder="Create a password" required>
<button type="button" class="password-button" aria-label="Show password">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
<path d="M1 12S5 5 12 5S23 12 23 12S19 19 12 19S1 12 1 12Z"></path>
<circle cx="12" cy="12" r="3"></circle>
</svg>
</button>
</div>
</div>
<div class="form-field">
<label for="confirmPassword">Confirm Password</label>
<div class="password-wrapper">
<input type="password" id="confirmPassword" placeholder="Confirm your password" required>
<button type="button" class="password-button" aria-label="Show password">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
<path d="M1 12S5 5 12 5S23 12 23 12S19 19 12 19S1 12 1 12Z"></path>
<circle cx="12" cy="12" r="3"></circle>
</svg>
</button>
</div>
</div>
</div>
<div class="terms-wrapper">
<label class="terms-checkbox">
<input type="checkbox" id="terms" required>
<span>I agree to the <a href="terms.html">Terms & Conditions</a> and <a href="privacy-policy.html">Privacy Policy</a></span>
</label>
</div>
<button type="submit" class="register-button">
<span>Create Account</span>
<svg class="button-arrow" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
<line x1="5" y1="12" x2="19" y2="12"></line>
<polyline points="12 5 19 12 12 19"></polyline>
</svg>
</button>
<div class="divider">
<span>or sign up with</span>
</div>
<div class="social-login">
<a href="#" class="social-button">
<img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg" alt="Google">
<span>Google</span>
</a>
<a href="#" class="social-button">
<img src="https://upload.wikimedia.org/wikipedia/commons/4/44/Microsoft_logo.svg" alt="Microsoft">
<span>Microsoft</span>
</a>
<a href="#" class="social-button">
<img src="https://cdn.simpleicons.org/apple" alt="Apple">
<span>Apple</span>
</a>
</div>
<div class="signin-link">
<p>Already have an account? <a href="login.html">Sign In</a></p>
</div>
</form>
</div>
</main>
<script src="assets/js/register.js"></script>
</body>
</html>
