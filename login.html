<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Login | Scholar Stationery</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- <link rel="stylesheet" href="assets/css/styles.css" /> -->

    <link rel="stylesheet" href="assets/css/login.css" />
  </head>

  <body>
    <main class="login-page">
      <div class="login-card">
        <div class="card-top">
          <div class="card-actions">

            <button class="header-icon-button rtl-toggle" title="RTL Mode">
              RTL

              <!-- <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">

<path d="M21 5H10"></path>

<path d="M21 12H7"></path>

<path d="M21 19H10"></path>

<path d="M7 5L3 9L7 13"></path>

</svg> -->
            </button>
            <button class="header-icon-button theme-toggle" title="Dark Mode">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <path
                  d="M21 12.79A9 9 0 1 1 11.21 3A7 7 0 0 0 21 12.79Z"
                ></path>
              </svg>
            </button>
          </div>

          <a href="index.html" class="brand" aria-label="Scholar Stationery Home">
                <span class="brand__logo">
                    <img src="https://www.svgrepo.com/show/492785/book-and-person-summer.svg"
                         alt="Scholar Stationery Logo">
                </span>
                <span class="brand__name">
                    Scholar<span>Stationery</span>
                </span>
            </a>

          <h2 class="login-title">Welcome Back</h2>

          <!-- <p class="login-description">
            Sign in to access your account and continue shopping.
          </p> -->
        </div>

        <form class="login-form">
          <div class="form-field">
            <label for="email"> Email Address </label>

            <input
              type="email"
              id="email"
              placeholder="Enter your email address"
              required
            />
          </div>

          <div class="form-field">
            <label for="password"> Password </label>

            <div class="password-wrapper">
              <input
                type="password"
                id="password"
                placeholder="Enter your password"
                required
              />

              <button type="button" class="password-button" id="togglePassword">
                👁
              </button>
            </div>
          </div>

          <div class="form-options">
            <label class="remember-me">
              <input type="checkbox" id="remember" />

              <span> Remember Me </span>
            </label>

            <a href="forgot-password.html" class="forgot-password">
              Forgot Password?
            </a>
          </div>

          <button type="submit" class="login-button">
            <span> Sign In </span>

            <svg
              class="button-arrow"
              xmlns="http://www.w3.org/2000/svg"
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <line x1="5" y1="12" x2="19" y2="12"></line>

              <polyline points="12 5 19 12 12 19"></polyline>
            </svg>
          </button>

          <div class="divider">
            <span> or continue with </span>
          </div>

          <div class="social-login">
            <a href="#" class="social-button">
              <img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg">

              <span> Google </span>
            </a>

            <a href="#" class="social-button">
              <img src="https://upload.wikimedia.org/wikipedia/commons/4/44/Microsoft_logo.svg">

              <span> Microsoft </span>
            </a>

            <a href="#" class="social-button">
              <img src="https://cdn.simpleicons.org/apple" alt="Apple" />

              <span> Apple </span>
            </a>
          </div>

          <div class="signup-link">
            <p>
              Don't have an account?

              <a href="register.html"> Create Account </a>
            </p>
          </div>
        </form>
      </div>
    </main>
    <script src="assets/js/login.js"></script>
    <script src="assets/js/login.js"></script>
  </body>
</html>
