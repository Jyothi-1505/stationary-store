<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Login | Scholar Stationery</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- <link rel="stylesheet" href="assets/css/styles.css" /> -->

    <link rel="stylesheet" href="assets/css/login.css" />
  </head>

  <body>
    <div class=".header__actions">
            <button class="header-icon-button rtl-toggle" data-rtl-toggle title="RTL Mode">
              RTL
            </button>

            <button class="header-icon-button theme-toggle" data-theme-toggle title="Dark Mode">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <path
                  d="M21 12.79A9 9 0 1 1 11.21 3A7 7 0 0 0 21 12.79Z"
                ></path>
              </svg>
            </button>
          </div>
    <main class="login-page">
      <div class="login-card">
        <div class="card-top">
          <a href="index.html" class="brand">
            <div class="brand__logo">
              <img
                src="https://d1csarkz8obe9u.cloudfront.net/posterpreviews/edu-smart-logos-design-template-23b6de7d02972a120e8ad62879fb66f4_screen.jpg?ts=1661512030"
                alt="EduMart Logo"
              />
            </div>

            <div class="brand__text">
              <h2>Edu<span>Mart</span></h2>
              <!-- <p>Books & School Supplies</p> -->
            </div>
          </a>

          <h2 class="login-title">Welcome Back</h2>

          <!-- <p class="login-description">
            Sign in to access your account and continue shopping.
          </p> -->
        </div>

        <form class="login-form">
          <div class="form-field">
            <label for="email"> Email Address </label>

            <input
              type="email"
              id="email"
              placeholder="Enter your email address"
              required
            />
          </div>

          <div class="form-field">
            <label for="password"> Password </label>
<div class="password-wrapper">
<input type="password" id="password" placeholder="Enter your password" required>
<button type="button" class="password-button" id="togglePassword" aria-label="Show password">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
<path d="M2 12S5.5 5 12 5s10 7 10 7-3.5 7-10 7S2 12 2 12Z"></path>
<circle cx="12" cy="12" r="3"></circle>
</svg>
</button>
</div>
            <!-- <div class="password-wrapper">
              <input
                type="password"
                id="password"
                placeholder="Enter your password"
                required
              />
<button type="button" class="password-button" id="togglePassword">

<svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

<path d="M1 12S5 5 12 5S23 12 23 12S19 19 12 19S1 12 1 12Z"></path>

<circle cx="12" cy="12" r="3"></circle>

</svg>

</button>
            </div> -->
          </div>

          <div class="form-options">
            <label class="remember-me">
              <input type="checkbox" id="remember" />

              <span> Remember Me </span>
            </label>

            <a href="forgot-password.html" class="forgot-password">
              Forgot Password?
            </a>
          </div>

          <button type="submit" class="login-button">
            <span> Sign In </span>

            <svg
              class="button-arrow"
              xmlns="http://www.w3.org/2000/svg"
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <line x1="5" y1="12" x2="19" y2="12"></line>

              <polyline points="12 5 19 12 12 19"></polyline>
            </svg>
          </button>

          <div class="divider">
            <span> or continue with </span>
          </div>

          <div class="social-login">
            <a href="#" class="social-button">
              <img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg">

              <span> Google </span>
            </a>

            <a href="#" class="social-button">
              <img src="https://upload.wikimedia.org/wikipedia/commons/4/44/Microsoft_logo.svg">

              <span> Microsoft </span>
            </a>

            <a href="#" class="social-button">
              <img src="https://cdn.simpleicons.org/apple" alt="Apple" />

              <span> Apple </span>
            </a>
          </div>

          <div class="signup-link">
            <p>
              Don't have an account?

              <a href="register.html"> Create Account </a>
            </p>
          </div>
        </form>
      </div>
    </main>
    <!-- <script src="assets/js/login.js"></script> -->
    <script src="assets/js/login.js"></script>
  </body>
</html>
